# rtpengine.conf — shared media anchor for trusted-edge + gateway-edge.
#
# rtpengine runs in host network mode (see docker-compose.yml), so all
# listen addresses are on the host's IP stack directly. Both OpenSIPS
# instances reach the NG control socket via 127.0.0.1:22222.
#
# GLib key-file format: use '#' for comments, NOT ';'.

[rtpengine]

# Media interface(s). Set via the --interface CLI flag from
# docker-compose.yml so the value comes from RTPENGINE_INTERFACE in .env
# (CLI flag overrides any value here). Format: PRIVATE_IP!PUBLIC_IP for
# NAT'd hosts; a single public IP suffices for a single-NIC server.

# NG protocol control socket (OpenSIPS talks to us here).
listen-ng = 127.0.0.1:22222

# UDP port range for RTP media. Expand or contract to taste; make sure
# the host firewall allows UDP in this range from carrier + mediasoup.
port-min = 10000
port-max = 20000

# Logging — stderr so `docker logs rtpengine` shows output.
log-level = 6
log-stderr = true

# Kernel-module forwarding disabled. xt_RTPENGINE usually isn't loaded
# on cloud VMs, and we don't want the container to fail looking for it.
# table = -1 forces pure-userspace mode — slower but works everywhere.
table = -1

# Timeouts (seconds). Increase if carriers stall briefly during codec
# renegotiation.
timeout = 60
silent-timeout = 3600
final-timeout = 0

# Defaults for the media anchor. SDES/DTLS offered when the far side
# asks for SRTP; passthrough when both legs are RTP.
delete-delay = 30

# Continuous audio pipeline for transcoded calls. When enabled, rtpengine
# generates a stable egress SSRC per leg and emits 50pps regardless of
# input cadence — fills input gaps with PLC/silence, smooths over carrier
# packet loss, and (most importantly) MASKS Twilio's mid-call SSRC
# rotation between early-media and actual-call streams. The Producer in
# mediasoup binds to rtpengine's stable egress SSRC and stays correct
# for the entire call regardless of what the carrier does upstream.
#
# This obsoletes the workarounds we built in signalling-service
# (_awaitAcceptedPlusGrace gate) and sidecar (rotation-tracking poll) —
# those can be reverted once we've verified this is healthy in field.
#
# 'transcoding' = active for transcoded streams only. Other modes:
#   - 'on-demand'   : engaged via NG `play media`/`record-call` only
#   - 'always'      : on for every call (passthrough included; higher CPU)
#   - 'play-media'  : only for explicit play-media commands
#
# Engaged 'always' so the audio-player pipeline is active for every
# call regardless of whether transcoding kicks in. Reasoning from
# field observation:
#
#   * WS↔phone both-Opus (passthrough) — without audio-player, rtpengine
#     forwards the phone's RTP carrying the phone's SSRC. mediasoup's
#     Producer binds via the controller's `rtpengine_ssrc_update` poll,
#     which is racy on the first packets → WS browser gets silence
#     during the binding window. Audio-player gives rtpengine a
#     stable egress SSRC even in passthrough so the binding is reliable.
#
#   * WS Opus ↔ phone PCMU/PCMA (transcoding) — without audio-player,
#     rtpengine transcodes the payload but preserves RTP header
#     extensions from the input. mediasoup stamps an RFC 5285 BEDE
#     audio-level extension on its outbound RTP; the Grandstream
#     drops any packet with X=1 in the header → "phone no audio."
#     Audio-player rebuilds the RTP header from scratch, so the
#     extension is stripped.
#
# CPU cost: extra decode-process-encode per call. Acceptable for
# current call volumes. Other valid values for downscaling later:
#   - 'on-demand'   : engaged via NG `play media`/`record-call` only
#   - 'transcoding' : active for transcoded streams only
#   - 'always'      : on for every call
#   - 'play-media'  : only for explicit play-media commands
#
# This is a startup-level rtpengine setting; it cannot be set as a
# per-call NG offer flag (verified: doing so makes rtpengine drop
# all media in both directions). The cfg comment in
# opensips_common/rtpengine_bind.cfg / trusted-edge.opensips.cfg
# referencing per-call NG flags for audio-player is stale.
#
# 2026-05-18: DOWNGRADED from 'always' to 'transcoding'. Originally set
# to 'always' to mask Twilio mid-call SSRC rotation and the
# WS↔phone-Opus passthrough binding race (see above). Stepped down for
# two reasons:
#   - CPU cost of audio-player on every passthrough call is unnecessary
#     once both legs negotiate the same codec.
#   - Keeps the Grandstream BEDE strip / mediasoup-stable-SSRC behavior
#     active on transcoded legs (PCMU/PCMA/G.722 ↔ Opus), which is where
#     it matters most for interop.
# Tradeoff accepted: the WS↔phone both-Opus passthrough path no longer
# gets audio-player's stable egress SSRC, so the first-packet binding
# race documented above can resurface on those calls. Bump back to
# 'always' if that race shows up in the field again.
#
# 2026-05-18 (later): STEPPED DOWN AGAIN to 'on-demand' — G.722 chipmunk
# symptom persisted under 'transcoding' (ci=0_766972635@192.168.200.67
# repro: phone hears 2× sped-up audio on return leg, PSTN side clean).
# This is the diagnostic next step the previous downgrade commit
# explicitly flagged: "transcoded G.722 legs still run through the
# audio-player pipeline under this setting — if a G.722 chipmunk symptom
# returns, this knob will not isolate it; drop to 'on-demand' for that
# diagnostic." 'on-demand' removes the audio-player decode/encode
# pipeline from the G.722 transcoded leg entirely; if chipmunk
# disappears the pipeline is the culprit and we file upstream / stay
# here; if it persists the bug is in rtpengine's core transcoder, not
# the audio-player wrapper.
# Re-exposed regressions on this setting (same list as the 'always→off'
# attempt earlier today):
#   - first-packet silence window in WS↔phone Opus passthrough (SSRC
#     binding race in mediasoup Producer)
#   - Grandstream "phone no audio" when transcoding (BEDE audio-level
#     ext X=1 not stripped from forwarded RTP headers)
# Bump back to 'transcoding' or 'always' once the G.722 path is fixed
# upstream or replaced.
#
# 2026-05-21: DOWNGRADED TO 'on-demand' permanently. The SSRC race that
# 'always' was masking is now solved at a different layer: opensips
# emits SSRC-egress=md5(callId)[:8] on every rtpengine offer, our
# patched rtpengine stamps that deterministic value on every egress
# packet, sidecar computes the same hash and writes it into the SDP
# it forwards to signalling. Call-controller binds the mediasoup
# Producer to that value at INVITE time -- no first-packet race, no
# rotation events, no observation pipeline.
#
# With the SSRC race gone, audio-player has no remaining job for
# passthrough or transcoded calls. 'on-demand' disables the
# decode/encode/mix pipeline except when explicitly invoked by
# play-media / record-call NG commands. Net effect: no per-call CPU
# overhead, no codec-handler bug surface (this is what killed G.722
# support), no audio-player-side rewriting of RTP headers (so
# Grandstream BEDE forwarding may differ slightly -- watch for it
# during the rollout window, but the deterministic-SSRC fix should
# make the previous workarounds unnecessary).
#
# Reverting: set back to 'always' if the deterministic-SSRC path
# turns out to have a hole that audio-player was filling. The whole
# stack (opensips + rtpengine fork + sidecar) is in place; reverting
# here is one line + a container restart.
audio-player = on-demand

# Audio-player pipeline tuning (companions to audio-player=transcoding).
#
#   audio-buffer-length: per-frame buffer size in ms. 20 matches PCMU/PCMA
#     and Opus 20ms ptime — one packet per buffer, no fragmentation or
#     reassembly cost on output.
#
#   audio-buffer-delay:  playout delay in ms before emitting from the
#     pipeline. 5ms is the minimum useful jitter cushion — enough to
#     reorder near-simultaneous arrivals, small enough to avoid adding
#     perceptible latency to the call. Larger values trade latency for
#     loss tolerance; smaller values can cause underruns on bursty input.
