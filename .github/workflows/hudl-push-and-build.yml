name: Hudl - Build and Push rtpengine

# Dedicated Hudl workflow for the feature/ssrc-force-egress branch — builds the
# production rtpengine image FROM THIS CHECKOUT (docker/hudl.Dockerfile) and
# pushes it to the GitHub Container Registry (ghcr.io), which is free for
# public repositories. This repo now owns the rtpengine image;
# opensips-edge no longer builds it. Upstream sipwise workflows (unit-tests,
# debian-package-build, ...) are untouched and keep running on their own
# triggers.
#
# Image URL for c2 default_images / Nomad job specs:
#   ghcr.io/dnygate/rtpengine:1.0.0        (stable tag c2 pins today)
#   ghcr.io/dnygate/rtpengine:ssrc-force-egress
#   ghcr.io/dnygate/rtpengine:sha-<commit>

on:
    push:
        branches: [feature/ssrc-force-egress]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # docker-container driver — required for the type=gha cache export
            # (the default docker driver cannot export a build cache).
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=sha
                      type=raw,value=ssrc-force-egress
                      # Stable tag the c2 default_images rows pin. The Nomad job
                      # uses force_pull, so a redeploy always picks up the
                      # freshest build of this tag.
                      type=raw,value=1.0.0
                      type=raw,value=latest

            - name: Build and push rtpengine
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/hudl.Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=rtpengine-hudl
                  cache-to: type=gha,mode=max,scope=rtpengine-hudl
